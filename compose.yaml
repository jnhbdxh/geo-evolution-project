services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: geo_os
      POSTGRES_USER: geo_os_migrator
      POSTGRES_PASSWORD: geo_os_migrator
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo_os_migrator -d geo_os"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - geo_os_postgres:/var/lib/postgresql/data
      - ./packages/database/docker/init-app-role.sql:/docker-entrypoint-initdb.d/001-init-app-role.sql:ro

  postgres-test:
    image: postgres:17-alpine
    profiles: ["database-test"]
    environment:
      POSTGRES_DB: geo_os_test
      POSTGRES_USER: geo_os_migrator
      POSTGRES_PASSWORD: geo_os_migrator
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo_os_migrator -d geo_os_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./packages/database/docker/init-app-role.sql:/docker-entrypoint-initdb.d/001-init-app-role.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - geo_os_redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: geo_os_minio
      MINIO_ROOT_PASSWORD: geo_os_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - geo_os_minio:/data

  minio-test:
    image: minio/minio:latest
    profiles: ["capture-test"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: geo_os_minio_test
      MINIO_ROOT_PASSWORD: geo_os_minio_test_secret
    ports:
      - "9100:9000"
      - "9101:9001"
    tmpfs:
      - /data

volumes:
  geo_os_postgres:
  geo_os_redis:
  geo_os_minio:
