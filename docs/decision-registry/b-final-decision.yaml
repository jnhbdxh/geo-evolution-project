semantic_boundary:
  - Formal results derive from explicit decisions rather than UI inference.
  - Metric contribution preserves decision provenance and eligibility semantics.
  - Mention, Consideration, and Recommendation are distinct decisions.
  - Question echo does not automatically establish Mention.
  - VALUE_1, VALUE_0, NO_CONTRIBUTION, and UNKNOWN remain distinct.
  - Target set, applicability, and Coverage Context are frozen with the decision context.
  - Recommendation cannot be inferred automatically from Mention.
