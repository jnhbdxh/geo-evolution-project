rules:
  - Dimensions are independent and do not form a linear state machine.
  - COMPLETE means complete only for the named capability and evidence scope.
  - INTEGRATION_VERIFIED records its environment; it does not imply production verification.
  - PRODUCT_ACCEPTED requires an explicit product acceptance decision and cannot be inferred from tests.
  - A class, table, API, or page existing alone never establishes product completion.
  - Top-level ACTIVE/COMMITTED identifies the last version-controlled authority; working_revision records uncommitted documentation changes without interrupting that authority.

