effective_date: "2026-08-24"
purpose: >-
  Defines document authority by decision domain, records status and supersession, and
  separates normative sources from implementation evidence and historical context.

status_definitions:
  FROZEN: Approved immutable decision or database record; changes require a new version.
  ACTIVE: Current normative source for its declared authority domains.
  ACTIVE_WORKING_BASELINE: Current committed implementation baseline; changes remain version controlled and reviewable.
  ACTIVE_WITH_ADDENDUM: Active source whose later implementation state is described by a separate addendum.
  REVIEW_CANDIDATE: Filled review input that has not been approved as an active source.
  SUPERSEDED: Historical source replaced by an explicitly named successor.
  HISTORICAL: Preserved decision history with no current normative authority.
  CONTEXT_ONLY: Handoff or explanatory material that does not define product behavior.
  EVIDENCE_PASSED: Committed acceptance evidence whose declared verification scope passed.
  WORKING: Worktree-only contract that is not yet a committed repository baseline.
  SOURCE_REFERENCE: External finalized source mapped through an active repository baseline.

authority_resolution:
  principles:
    - Authority is resolved within a decision domain, never by one global document ranking.
    - Within one domain, use formal status, applicable scope, effective version, and explicit supersession.
    - Frozen A1/A2/A3/B/C packs remain the semantic authority for their domains.
    - Frozen migrations and Freeze Records define implemented DDL identity, not desired future behavior.
    - Code describes current implementation and tests provide conformance evidence; neither overrides a normative contract.
    - A conflict between implementation evidence and an authoritative contract is recorded as a nonconformance.
  domains:
    product_scope: docs/product/GEO_OS_V2_Product_Scope_and_Implementation_Baseline_V1.0.md
    core_domain_lifecycle_authorization: docs/contracts/GEO_OS_Core_Domain_Lifecycle_and_Authorization_Contract_V1.0.md
    rules_metrics_evidence_attribution: docs/contracts/GEO_OS_Rules_Metrics_Evidence_and_Attribution_Contract_V1.0.md
    engineering_interaction_release: docs/contracts/GEO_OS_Engineering_Boundaries_Interaction_and_Release_Contract_V1.0.md
    implemented_database: docs/contracts/slice-1-and-2-ddl-freeze-record-v1.0.md
    current_implementation: docs/product-implementation-status.yaml

